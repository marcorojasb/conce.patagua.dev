name: Sync OSM + GTFS data

on:
  schedule:
    # 06:30 UTC daily ≈ 03:30 Chile (CLT/CLST). Off-peak for both Overpass
    # mirrors and Vercel build queues.
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync all OSM-backed datasets
        run: npm run sync:osm

      - name: Restore GTFS zip cache
        # El script reutiliza .cache/gtfs/ si dtpr.gob.cl informa el mismo
        # ETag/Last-Modified y tamaño: evita bajar ~37 MB cada noche.
        uses: actions/cache@v4
        with:
          path: .cache/gtfs
          key: gtfs-zip-${{ github.run_id }}
          restore-keys: gtfs-zip-

      - name: Sync official GTFS (DTPR)
        # Descarga el GTFS oficial de Gran Concepción y regenera gtfs-*.generated.ts
        # y la grilla de cobertura. Si el feed no cambió, solo cambia coverage
        # (marca de tiempo) y nada más.
        run: npm run sync:gtfs

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- src/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- src/data
          fi

      - name: Open pull request with refreshed data
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: |
            data: refresh OSM and GTFS datasets (automated sync)
          branch: data/auto-sync
          delete-branch: true
          title: 'data: refresh OSM and GTFS datasets'
          body: |
            Automated nightly sync from OpenStreetMap (Overpass API), Wikidata and
            the official GTFS of Gran Concepción published by DTPR.

            Refreshed:
            - `src/data/biotren.generated.ts` (railway=station, operator=EFE)
            - `src/data/biotren-track.generated.ts` (railway=rail, Dijkstra)
            - `src/data/terminals.generated.ts` (amenity=bus_station)
            - `src/data/pois.generated.ts` (hospital, university, college, mall)
            - `src/data/wikidata.generated.ts` (SPARQL: Q-ids e imágenes)
            - `src/data/cycleways.generated.ts` (infra ciclista)
            - `src/data/greenspace.generated.ts` (parques, plazas, reservas)
            - `src/data/schools.generated.ts` (establecimientos educacionales)
            - `src/data/interurban-routes.generated.ts` (corredores 201/401/411/421)
            - `src/data/gtfs-*.generated.ts` (GTFS oficial DTPR: paraderos, recorridos,
              horarios y pasadas por paradero; solo cambian si cambió el feed)
            - `src/data/coverage.generated.ts` (grilla de cobertura de paraderos)

            Si cambió el GTFS, revisar `GTFS_CONCEPCION_SOURCE` en
            `gtfs-stops.generated.ts` (versión, vigencia y sha256 del zip).

            Review the diff: if it looks reasonable, merge and Vercel will redeploy.
          labels: |
            data
            automated
